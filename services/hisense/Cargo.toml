[package]
name = "homecore-hisense"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
plugin-sdk-rs = { path = "../../crates/vendor/plugin-sdk-rs" }
homecore-bounded-http = { path = "../../crates/bounded-http" }
quick-xml = "=0.39.4"
reqwest = { version = "=0.12.28", default-features = false }
rumqttc = { version = "=0.25.1", default-features = false }
serde_json = "=1.0.145"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }

[dev-dependencies]
homecore-test-support = { path = "../../crates/test-support" }
axum = "=0.8.8"
