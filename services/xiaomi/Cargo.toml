[package]
name = "homecore-xiaomi"
version = "0.1.0"
edition = "2021"

[features]
default = ["setup"]
setup = ["dep:plugin-sdk-rs", "dep:rumqttc", "dep:rusqlite"]
postgres = ["setup", "dep:rustls", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:webpki-roots"]
extractor = ["dep:axum", "dep:futures-util", "dep:subtle"]

[[bin]]
name = "homecore-xiaomi"
path = "src/main.rs"
required-features = ["setup"]

[[bin]]
name = "xiaomi-extractor"
path = "src/bin/xiaomi-extractor.rs"
required-features = ["extractor"]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
homecore-bounded-http = { path = "../../crates/bounded-http" }
base64 = "=0.23.1"
ring = "=0.17.14"
libc = "=0.2.191"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
rumqttc = { version = "=0.25.1", default-features = false, optional = true }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"], optional = true }
tokio-postgres = { version = "=0.7.18", optional = true }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "=1.0.12", optional = true }
rc4 = { version = "=0.2.0", features = ["zeroize"] }
zeroize = "=1.9.2"
plugin-sdk-rs = { path = "../../crates/vendor/plugin-sdk-rs", optional = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
futures-util = { version = "=0.3.34", default-features = false, optional = true }
subtle = { version = "=2.6.1", default-features = false, optional = true }

[dev-dependencies]
homecore-test-support = { path = "../../crates/test-support" }
axum = "=0.8.9"
