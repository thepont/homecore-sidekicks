[package]
name = "homecore-mitsubishi"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
serde_json = "=1.0.145"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
rumqttc = { version = "=0.25.1", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["test-util"] }
