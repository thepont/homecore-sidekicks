[package]
name = "homecore-powerwall"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = "symbols"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
rumqttc = { version = "=0.25.1", default-features = false }
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }

[dev-dependencies]
axum = "=0.8.8"
