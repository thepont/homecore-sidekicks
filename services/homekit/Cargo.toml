[package]
name = "homecore-homekit"
version = "0.1.0"
edition = "2021"

[dependencies]
hap-controller = "=3.3.0"
hap-crypto = "=1.4.0"
hap-pairing = "=2.1.0"
hap-transport = "=1.3.1"
rumqttc = { version = "=0.25.1", default-features = false }
plugin-sdk-rs = { git = "https://github.com/homeCore-io/homeCore.git", rev = "40a9c649e33bd61d8cbb343eebf20b61bd624ca3", version = "0.6.5" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=1.2.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-stream = "=0.1.19"
uuid = { version = "=1.29.3", features = ["v4"] }


[patch.crates-io]
hap-transport = { path = "vendor/hap-transport" }

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ring = "=0.17.14"
