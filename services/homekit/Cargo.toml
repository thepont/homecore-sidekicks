[package]
name = "homecore-homekit"
version = "0.1.0"
edition = "2021"

[dependencies]
hap-controller = "=3.3.0"
serde_json = "=1.0.145"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[dev-dependencies]
hap-transport = "=1.3.1"

[patch.crates-io]
hap-transport = { path = "vendor/hap-transport" }
