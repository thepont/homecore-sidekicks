[package]
name = "homecore-teslemetry"
version = "0.1.1"
edition = "2021"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]
homecore-bounded-http = { path = "../../crates/bounded-http" }
homecore-plugin-ui = { path = "../../crates/plugin-ui" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
rumqttc = { version = "=0.25.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
ring = "=0.17.14"
base64 = "=0.23.1"
libc = "=0.2.191"
chrono-tz = "=0.10.4"

[dev-dependencies]
homecore-test-support = { path = "../../crates/test-support" }
axum = "=0.8.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
