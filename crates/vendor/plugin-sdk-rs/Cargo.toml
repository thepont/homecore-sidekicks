[package]
name    = "plugin-sdk-rs"
version    = "0.6.5"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rumqttc    = { version = "0.25", default-features = false }
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "fmt"] }
chrono     = { version = "0.4", features = ["serde"] }
toml       = "1"
hc-types   = { git = "https://github.com/homeCore-io/homeCore.git", rev = "40a9c649e33bd61d8cbb343eebf20b61bd624ca3", features = ["descriptor"] }
# Log rotation lives here now (see src/logging.rs), so the file sink and gzip
# compression it needs are SDK dependencies rather than eleven plugins'.
tracing-appender = "0.2"
flate2           = "1"
# Optional, behind the `schema` feature. Plugin config structs embed
# `logging::LoggingConfig` and derive JsonSchema for the config descriptor, so
# LoggingConfig has to derive it too — under the SAME feature, or the plugin's
# `--features schema` build fails on a field whose type does not implement it.
schemars = { version = "1", optional = true }
hc-logging = { git = "https://github.com/homeCore-io/homeCore.git", rev = "40a9c649e33bd61d8cbb343eebf20b61bd624ca3" }
hc-time    = { git = "https://github.com/homeCore-io/homeCore.git", rev = "40a9c649e33bd61d8cbb343eebf20b61bd624ca3" }
# A plugin's own UI: hashing its folder into a build id, and sending its
# files in pieces over the management channel.
sha2       = "0.10"
base64     = "0.23"

[features]
default = []
# Enabled by plugins via `plugin-sdk-rs/schema` from their own `schema` feature.
schema = ["dep:schemars"]

[dev-dependencies]
# A client whose requests a test can read back: rumqttc's AsyncClient::from_senders.
flume = "0.11"
