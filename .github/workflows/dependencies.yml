name: Dependency security

on:
  push:
    branches: [main]
    paths: &dependency_paths
      - 'services/**/Cargo.toml'
      - 'services/**/Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'services/**/package.json'
      - 'services/**/package-lock.json'
      - 'tools/**/Cargo.toml'
      - 'tools/**/Cargo.lock'
      - 'tools/**/package.json'
      - 'tools/**/package-lock.json'
      - '.github/workflows/dependencies.yml'
  pull_request:
    paths: *dependency_paths
  schedule:
    - cron: '25 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: '0.23.0'
          CARGO_AUDIT_SHA256: b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59
        run: |
          release="cargo-audit-x86_64-unknown-linux-gnu-v$CARGO_AUDIT_VERSION"
          archive="$RUNNER_TEMP/$release.tgz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            --output "$archive" "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$CARGO_AUDIT_VERSION/$release.tgz"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" "$release/cargo-audit"
          printf '%s\n' "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"
      - name: Audit Rust lockfiles
        run: |
          status=0
          for lockfile in services/*/Cargo.lock tools/quality-gate/Cargo.lock; do
            printf '\nAuditing %s\n' "$lockfile"
            cargo-audit audit --file "$lockfile" || status=1
          done
          exit "$status"

  npm:
    name: npm advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Audit npm lockfiles
        run: |
          status=0
          for lockfile in services/*/tests/*/package-lock.json tools/javascript-quality/package-lock.json; do
            printf '\nAuditing %s\n' "$lockfile"
            npm audit --prefix "${lockfile%/*}" --package-lock-only --audit-level=low || status=1
          done
          exit "$status"
