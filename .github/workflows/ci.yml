name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: TruffleHog secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - &checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Scan tracked files using the pre-commit hook
        run: sh .githooks/pre-commit

  rust:
    name: Rust / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [electrolux, hisense, homekit, mitsubishi, teslemetry, xiaomi]
    env:
      SERVICE: ${{ matrix.service }}
      MANIFEST: services/${{ matrix.service }}/Cargo.toml
      RUST_TOOLCHAIN: '1.96.0'
    steps:
      - *checkout
      - name: Set up Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo "+$RUST_TOOLCHAIN" fmt --manifest-path "$MANIFEST" --check
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: matrix.service == 'homekit'
        with: &node_options
          node-version: '24'
          package-manager-cache: false
      - name: Install the HomeKit fixture
        if: matrix.service == 'homekit'
        run: npm ci --prefix services/homekit/tests/hap --ignore-scripts
      - name: Run Clippy and service tests
        run: |
          args=()
          if [[ "$SERVICE" == xiaomi ]]; then
            args+=(--features extractor,postgres)
          fi
          cargo "+$RUST_TOOLCHAIN" clippy --locked --manifest-path "$MANIFEST" "${args[@]}" --all-targets -- -D warnings
          cargo "+$RUST_TOOLCHAIN" test --locked --manifest-path "$MANIFEST" "${args[@]}"
      - name: Run Hisense MQTT and HomeCore contracts
        if: matrix.service == 'hisense'
        run: cargo "+$RUST_TOOLCHAIN" test --locked --manifest-path "$MANIFEST" --test core --test mqtt -- --ignored --test-threads=1

      - name: Build release binaries
        run: |
          if [[ "$SERVICE" == xiaomi ]]; then
            cargo "+$RUST_TOOLCHAIN" build --locked --release --manifest-path "$MANIFEST" --features postgres --bin homecore-xiaomi
            cargo "+$RUST_TOOLCHAIN" build --locked --release --manifest-path "$MANIFEST" --no-default-features --features extractor --bin xiaomi-extractor
          else
            cargo "+$RUST_TOOLCHAIN" build --locked --release --manifest-path "$MANIFEST" --bins
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: *node_options
      - name: Install browser test dependencies
        run: |
          npm ci --prefix services/teslemetry/tests/ui --ignore-scripts
          npm ci --prefix services/xiaomi/tests/ui --ignore-scripts
      - name: Run browser tests in Chrome
        run: |
          CHROMIUM_BIN="$(command -v google-chrome-stable || command -v google-chrome)"
          export CHROMIUM_BIN
          "$CHROMIUM_BIN" --version
          npm test --prefix services/teslemetry/tests/ui
          npm test --prefix services/xiaomi/tests/ui
          NODE_PATH="$PWD/services/teslemetry/tests/ui/node_modules" node --test ui/ac-card/tests/card.test.mjs
