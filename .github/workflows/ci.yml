name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [electrolux, hisense, homekit, mitsubishi, teslemetry, xiaomi]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: matrix.service == 'homekit'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the HomeKit fixture
        if: matrix.service == 'homekit'
        run: npm ci --prefix services/homekit/tests/hap --ignore-scripts
      - name: Run service tests
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          args=()
          if [[ "$SERVICE" == xiaomi ]]; then
            args+=(--features extractor,postgres)
          fi
          cargo +1.96.0 test --locked --manifest-path "services/$SERVICE/Cargo.toml" "${args[@]}"
      - name: Run Hisense MQTT and HomeCore contracts
        if: matrix.service == 'hisense'
        run: cargo +1.96.0 test --locked --manifest-path services/hisense/Cargo.toml --test core --test mqtt -- --ignored --test-threads=1

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: |
          npm ci --prefix services/teslemetry/tests/ui --ignore-scripts
          npm ci --prefix services/xiaomi/tests/ui --ignore-scripts
      - name: Install Chromium
        working-directory: services/teslemetry/tests/ui
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          npm test --prefix services/teslemetry/tests/ui
          npm test --prefix services/xiaomi/tests/ui
          NODE_PATH="$PWD/services/teslemetry/tests/ui/node_modules" node --test ui/ac-card/tests/card.test.mjs
